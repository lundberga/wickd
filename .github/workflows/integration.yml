name: Integration Tests

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # manual trigger from GitHub UI

jobs:
  integration:
    name: Real API Integration Tests
    runs-on: ubuntu-latest
    # Only run if API keys are configured
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK with all providers
        run: |
          cd packages/sdk-python
          pip install -e ".[all,dev]"

      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          cd packages/sdk-python
          PYTHONPATH=. python -m pytest tests/integration/ -v --timeout=120

  stress:
    name: Concurrent Stress Test
    runs-on: ubuntu-latest
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK with all providers
        run: |
          cd packages/sdk-python
          pip install -e ".[all,dev]"

      - name: Run stress tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd packages/sdk-python
          PYTHONPATH=. python -m pytest tests/integration/test_stress.py -v --timeout=300
