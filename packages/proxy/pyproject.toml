[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "wickd-proxy"
version = "0.1.0"
description = "LLM proxy server for Wickd — budget enforcement without monkey-patching"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Wickd", email = "hello@wickd.dev" },
]
keywords = ["ai", "agents", "guardrails", "llm", "proxy"]
dependencies = [
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "wickd-ai>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27.0"]

[project.urls]
Homepage = "https://wickd.dev"
Repository = "https://github.com/lundberga/wickd"

[project.scripts]
wickd-proxy = "wickd_proxy.cli:main"
