[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "wickd-proxy"
version = "0.1.0"
description = "LLM proxy server for Wickd — budget enforcement without monkey-patching"
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "wickd>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27.0"]

[project.scripts]
wickd-proxy = "wickd_proxy.cli:main"
