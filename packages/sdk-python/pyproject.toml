[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wickd-ai"
version = "0.3.0"
description = "Guardrails for AI agents — budget limits, kill switches, and human approval gates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Wickd", email = "hello@wickd.dev" },
]
keywords = ["ai", "agents", "guardrails", "budget", "observability", "llm", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
google = ["google-genai>=1.0.0"]
all = ["openai>=1.0.0", "anthropic>=0.20.0", "google-genai>=1.0.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "openai>=1.0.0", "anthropic>=0.20.0", "google-genai>=1.0.0"]

[project.urls]
Repository = "https://github.com/lundberga/wickd"

[tool.hatch.build.targets.wheel]
packages = ["wickd"]

[project.scripts]
wickd = "wickd.cli:main"
